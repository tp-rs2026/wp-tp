<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="robots" content="noindex, nofollow"/>
<title>tapara</title>
<script>
// Redirect clean URLs to the SPA — GitHub Pages serves 404.html for unknown paths
var path = location.pathname.replace(/\/$/, '') || '/';
var payMatch = path.match(/^\/pay\/(.+)$/);
if (payMatch) {
  // Keep the id in the URL so a reload, a back-swipe or a reopened tab still
  // finds the payment. Session storage stays as a fallback for older tabs.
  var payId = payMatch[1];
  sessionStorage.setItem('pay-request-id', payId);
  location.replace('/pay?pr=' + encodeURIComponent(payId));
} else {
  var routes = { '/': '/', '/consumers': '/', '/customers': '/', '/businesses': '/', '/merchants': '/', '/about': '/', '/how-it-works': '/', '/platform': '/', '/contact': '/', '/blog': '/', '/delete-account': '/' };
  if (path in routes || path.indexOf('/blog/') === 0) {
    sessionStorage.setItem('spa-redirect', path);
    location.replace('/');
  } else {
    location.replace('/');
  }
}
</script>
</head>
<body></body>
</html>
